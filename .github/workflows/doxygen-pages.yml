name: Publish Doxygen Documentation

on:
  push:
    branches:
      - pre-publish/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        shell: pwsh
        run: ./scripts/build-doxygen.ps1 -OutputDirectory build/doxygen -Clean

      - name: Prepare versioned Pages artifact
        shell: pwsh
        run: ./scripts/prepare-doxygen-pages.ps1 -DoxygenHtmlDirectory build/doxygen/html -OutputDirectory build/pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
